build:
  name: Nexus Widgets Debug
  steps:
    - eas/checkout
    - eas/install_node_modules
    - name: Run prebuild debug
      command: |
        set +e
        echo "=== NODE VERSION ==="
        node --version
        echo "=== PWD ==="
        pwd
        echo "=== LS ROOT ==="
        ls -la | head -30
        echo "=== native-targets ==="
        ls -la native-targets/ 2>&1 || echo "native-targets/ NOT FOUND"
        echo "=== Running prebuildCommand: node scripts/eas-prebuild.js ==="
        node scripts/eas-prebuild.js
        echo "=== Exit: $? ==="
    - eas/prebuild:
        clean: false
        run_placeholder_scheme_patch: false
